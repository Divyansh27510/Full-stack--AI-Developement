<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <h1>Today we will learn HTML Tables...</h1>
    <table border="2">
        <caption><b>Students Data</b></caption>
        <colgroup>
            <col style="background-color: burlywood;">
            <col style="background-color: cadetblue;">
            <col style="background-color: darkgray;">
        </colgroup>
        <thead>
            <tr>
                <th>Name</th>
                <th>Roll No</th>
                <th>CGPA</th>

            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Divyansh Singh</td>
                <td>CSJMA24001390057</td>
                <td>8.70</td>

            </tr>
            <tr>
                <td>Prakhar Pal</td>
                <td>CSJMA24001390099</td>
                <td>8.30</td>

            </tr>
            <tr>
                <td>Kishan Pandey</td>
                <td>CSJMA24001390074</td>
                <td>7.70</td>

            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="2">Average GPA </th>
                <th>8.40</th>
            </tr>
            
        </tfoot>
    </table>
</body>
</html>
